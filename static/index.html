<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Knowledge Layer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e2e5ea; --ink: #1a1d21; --dim: #6b7280;
    --accent: #2563eb; --green: #0f7b46; --red: #b42318; --amber: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 18px 28px; }
  h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 28px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px; margin-bottom: 18px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .tabs button { background: none; border: 1px solid transparent; border-radius: 8px;
                 padding: 8px 14px; font: inherit; color: var(--dim); cursor: pointer; }
  .tabs button.on { background: var(--card); border-color: var(--line); color: var(--ink); font-weight: 600; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
                   padding: 9px 16px; font: inherit; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line);
                  border-radius: 8px; background: #fff; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--dim); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .quote { color: var(--dim); font-size: 13px; border-left: 3px solid var(--line);
           padding-left: 10px; margin-top: 6px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
         background: #eef1f5; color: var(--dim); margin-right: 6px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; }
  .corroborates { background: #e6f5ed; color: var(--green); }
  .contradicts  { background: #fdeceb; color: var(--red); }
  .reconcilable { background: #fdf3e3; color: var(--amber); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
  .pair > div { background: #fafbfc; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .why { margin-top: 12px; font-size: 14px; }
  .why b { color: var(--dim); font-weight: 600; text-transform: uppercase; font-size: 11px;
           letter-spacing: .05em; display: block; margin-bottom: 3px; }
  a { color: var(--accent); text-decoration: none; }
  .muted { color: var(--dim); font-size: 13px; }
  .empty { text-align: center; color: var(--dim); padding: 40px 0; }
  @media (max-width: 720px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Fact Knowledge Layer</h1>
  <p id="config">Upload PDFs, get facts grounded in quotes and linked across documents.</p>
</header>

<main>
  <div class="card">
    <div class="row">
      <input type="file" id="files" accept="application/pdf" multiple>
      <label class="muted">first <input type="number" id="pages" value="20" min="0" style="width:70px"> pages (0 = all)</label>
      <button class="primary" id="go">Process</button>
      <span class="muted" id="msg"></span>
    </div>
  </div>

  <div class="tabs">
    <button data-tab="docs" class="on">Documents</button>
    <button data-tab="links">Links</button>
    <button data-tab="facts">Facts</button>
    <button data-tab="dropped">Dropped</button>
  </div>

  <div id="docs" class="tab"></div>

  <div id="links" class="tab" hidden>
    <div class="row" style="margin-bottom:14px">
      <select id="rel">
        <option value="">All relations</option>
        <option value="corroborates">Corroborates</option>
        <option value="contradicts">Contradicts</option>
        <option value="reconcilable">Reconcilable by context</option>
      </select>
    </div>
    <div id="links-body"></div>
  </div>

  <div id="facts" class="tab" hidden>
    <div class="row" style="margin-bottom:14px">
      <select id="doc"><option value="0">All documents</option></select>
      <input id="q" placeholder="search subject, value or evidence" style="min-width:280px">
    </div>
    <div id="facts-body"></div>
  </div>

  <div id="dropped" class="tab" hidden>
    <p class="muted">Facts the model returned with a quote that is not actually on the page.
      They are stored but never linked - this is the extraction-failure case, made visible
      instead of silently trusted.</p>
    <div id="dropped-body"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const get = async (url) => (await fetch(url)).json();
const src = f => `<a href="/pdf/${f.doc_id}#page=${f.page}" target="_blank">${esc(f.doc)} · p.${f.page}</a>`;

get("/api/config").then(c => $("#config").textContent =
  `Facts grounded in verbatim quotes, linked across documents. Model: ${c.model} via ${c.backend}.`);

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".tab").forEach(t => t.hidden = t.id !== b.dataset.tab);
  refresh();
});

$("#go").onclick = async () => {
  const files = $("#files").files;
  if (!files.length) return ($("#msg").textContent = "Choose at least one PDF.");
  const body = new FormData();
  for (const f of files) body.append("files", f);
  body.append("max_pages", $("#pages").value || "0");
  $("#go").disabled = true;
  $("#msg").textContent = "Uploading…";
  try {
    const r = await fetch("/api/upload", { method: "POST", body });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    $("#msg").textContent = "Queued. Processing runs in the background.";
    $("#files").value = "";
  } catch (e) { $("#msg").textContent = "Failed: " + e.message; }
  $("#go").disabled = false;
  refresh();
};

$("#rel").onchange = refresh;
$("#doc").onchange = refresh;
$("#q").oninput = debounce(refresh, 300);
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }

async function refresh() {
  const docs = await get("/api/documents");
  renderDocs(docs);
  const options = ['<option value="0">All documents</option>']
    .concat(docs.map(d => `<option value="${d.id}">${esc(d.name)}</option>`)).join("");
  if ($("#doc").innerHTML !== options) {
    const keep = $("#doc").value; $("#doc").innerHTML = options; $("#doc").value = keep;
  }
  if (!$("#links").hidden) renderLinks(await get("/api/relations?relation=" + $("#rel").value));
  if (!$("#facts").hidden)
    renderFacts("#facts-body", await get(`/api/facts?doc=${$("#doc").value}&q=${encodeURIComponent($("#q").value)}`));
  if (!$("#dropped").hidden) renderFacts("#dropped-body", await get("/api/facts?grounded=0"));
  const busy = docs.some(d => d.status !== "done" && d.status !== "failed");
  clearTimeout(refresh.timer);
  if (busy) refresh.timer = setTimeout(refresh, 3000);
}

function renderDocs(docs) {
  $("#docs").innerHTML = !docs.length
    ? `<div class="card empty">No documents yet. Upload a PDF above.</div>`
    : `<div class="card"><table><tr><th>Document</th><th>Status</th><th>Pages</th>
         <th>Facts</th><th>Dropped</th></tr>` + docs.map(d => `<tr>
         <td><a href="/pdf/${d.id}" target="_blank">${esc(d.name)}</a>
             ${d.note ? `<div class="quote">${esc(d.note)}</div>` : ""}</td>
         <td>${["done", "failed"].includes(d.status)
                 ? esc(d.status) : `<b>${esc(d.status)}…</b>`}</td>
         <td>${d.pages}</td><td>${d.facts}</td><td>${d.dropped}</td></tr>`).join("")
      + `</table></div>`;
}

function factBlock(f, p) {
  return `<div>
    <div class="muted">${src({ doc: f[p + "doc"], doc_id: f[p + "doc_id"], page: f[p + "page"] })}</div>
    <div style="margin-top:6px"><b>${esc(f[p + "subject"])}</b> — ${esc(f[p + "attribute"])}</div>
    <div style="font-size:17px;margin:4px 0">${esc(f[p + "value"])} ${esc(f[p + "unit"])}</div>
    ${tags(f[p + "period"], f[p + "scope"])}
    <div class="quote">“${esc(f[p + "quote"])}”</div></div>`;
}
const tags = (period, scope) =>
  (period ? `<span class="tag">${esc(period)}</span>` : "") +
  (scope ? `<span class="tag">${esc(scope)}</span>` : "");

function renderLinks(rels) {
  $("#links-body").innerHTML = !rels.length
    ? `<div class="card empty">No links yet. They appear once a second document is processed.</div>`
    : rels.map(r => `<div class="card">
        <span class="badge ${r.relation}">${r.relation}</span>
        <span class="muted"> confidence ${Number(r.confidence).toFixed(2)}</span>
        <div class="pair">${factBlock(r, "a_")}${factBlock(r, "b_")}</div>
        <div class="why"><b>Reasoning</b>${esc(r.reasoning)}</div></div>`).join("");
}

function renderFacts(target, facts) {
  $(target).innerHTML = !facts.length
    ? `<div class="card empty">Nothing here yet.</div>`
    : `<div class="card"><table><tr><th>Fact</th><th>Context</th><th>Evidence</th></tr>`
      + facts.map(f => `<tr>
          <td><b>${esc(f.subject)}</b><div class="muted">${esc(f.attribute)}</div>
              <div style="margin-top:4px">${esc(f.value)} ${esc(f.unit)}</div></td>
          <td>${tags(f.period, f.scope) || '<span class="muted">—</span>'}
              <div class="muted" style="margin-top:6px">${src(f)}</div></td>
          <td><div class="quote">“${esc(f.quote)}”</div>
              ${f.note ? `<div class="muted">${esc(f.note)}</div>` : ""}</td></tr>`).join("")
      + `</table></div>`;
}

refresh();
</script>
</body>
</html>
