<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Knowledge Layer</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #ffffff; --line: #e4e4e1; --ink: #1c1c1a;
    --muted: #74746e; --accent: #2563eb; --accent-soft: #dbeafe;
    --warn: #b45309; --warn-soft: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #1e1e22; --line: #33333a; --ink: #ececf0;
      --muted: #9a9aa4; --accent: #7aa2f7; --accent-soft: #1e2c4a;
      --warn: #e0a458; --warn-soft: #3a2f1c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px; background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12.5px; }
  main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 51px); }
  aside { border-right: 1px solid var(--line); padding: 16px; background: var(--panel); }
  section { padding: 16px 20px; min-width: 0; }

  #drop {
    border: 1.5px dashed var(--line); border-radius: 8px; padding: 20px 12px;
    text-align: center; color: var(--muted); cursor: pointer; font-size: 13px;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }

  .doc {
    padding: 9px 10px; border-radius: 6px; cursor: pointer; margin-top: 6px;
    border: 1px solid transparent;
  }
  .doc:hover { background: var(--accent-soft); }
  .doc.on { background: var(--accent-soft); border-color: var(--accent); }
  .doc b { display: block; font-weight: 550; word-break: break-word; font-size: 13px; }
  .doc small { color: var(--muted); font-size: 11.5px; }

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  input[type=text], input[type=number] {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 13px;
  }
  input[type=text] { flex: 1; min-width: 180px; }
  input[type=number] { width: 92px; }
  label.chk { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; cursor: pointer; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line);
  }
  td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:hover td { background: var(--accent-soft); }
  .pg { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .val { white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ev { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; word-break: break-word; }
  .ev mark { background: var(--accent-soft); color: var(--ink); font-weight: 700; border-radius: 2px; padding: 0 2px; }
  .why { color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 1px 6px; font-size: 11.5px; white-space: nowrap; }
  .lbl {
    font-family: ui-sans-serif, system-ui, sans-serif; color: var(--muted);
    border-right: 2px solid var(--line); padding-right: 7px; margin-right: 5px;
  }
  .lbl::before { content: "row: "; opacity: .65; }
  .metric { font-weight: 600; display: block; }
  .qual { color: var(--muted); font-size: 12px; }
  .qual b { font-weight: 600; color: var(--accent); }
  .none { color: var(--muted); font-style: italic; font-size: 12.5px; }
  .no { opacity: .45; }
  #label {
    width: 100%; margin-top: 14px; padding: 8px; border-radius: 6px; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; font: inherit; font-weight: 600;
  }
  #label:disabled { opacity: .4; cursor: default; }
  #lstat { color: var(--muted); font-size: 12px; margin-top: 6px; min-height: 16px; }
  select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px;
  }
  .empty { color: var(--muted); padding: 32px 8px; text-align: center; }
  .wrap { overflow-x: auto; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 4px; }
</style>
</head>
<body>
<header>
  <h1>Fact Knowledge Layer</h1>
  <span id="phase"></span>
</header>

<main>
  <aside>
    <div id="drop">Drop a PDF here<br>or click to choose</div>
    <input type="file" id="file" accept="application/pdf" hidden>
    <h2>Documents</h2>
    <div id="docs"></div>
    <button id="label" disabled>Label with model</button>
    <div id="lstat"></div>
  </aside>

  <section>
    <div class="controls">
      <input type="text" id="q" placeholder="Filter evidence lines…">
      <input type="number" id="page" placeholder="Page" min="0">
      <label class="chk"><input type="checkbox" id="rej"> rejected</label>
      <label class="chk"><input type="checkbox" id="only"> facts only</label>
      <select id="kind">
        <option value="">all evidence</option>
        <option value="number">numbers</option>
        <option value="text">text</option>
      </select>
      <span id="count" style="color:var(--muted);font-size:12.5px"></span>
    </div>
    <div class="wrap"><table>
      <thead><tr><th>PDF pg</th><th>Value</th><th>Label &middot; model</th><th>Evidence &middot; document</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div id="empty" class="empty">Upload a PDF to see the evidence mined from it.</div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let current = null;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function highlight(row) {
  const { text, char_start: a, char_end: b } = row;
  if (a == null || b == null || a < 0 || b > text.length || a >= b) return esc(text);
  return esc(text.slice(0, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>' + esc(text.slice(b));
}

async function loadDocs() {
  const docs = await (await fetch('/api/documents')).json();
  $('#docs').innerHTML = docs.map(d => `
    <div class="doc ${d.id === current ? 'on' : ''}" data-id="${d.id}">
      <b>${esc(d.filename)}</b>
      <small>${d.page_count}p · ${d.accepted} evidence · ${d.labelled} labelled · ${d.facts} facts</small>
    </div>`).join('') || '<div class="empty" style="padding:12px 0">None yet</div>';

  document.querySelectorAll('.doc').forEach(el =>
    el.onclick = () => { current = el.dataset.id; loadDocs(); loadRows(); });
  $('#label').disabled = !current;
}

async function loadRows() {
  if (!current) return;
  const p = new URLSearchParams({
    accepted: $('#rej').checked ? 0 : 1,
    q: $('#q').value.trim(),
    kind: $('#kind').value,
    labelled: $('#only').checked ? 1 : -1,
    page: $('#page').value === '' ? -1 : $('#page').value,
  });
  const rows = await (await fetch(`/api/documents/${current}/evidence?${p}`)).json();

  $('#empty').style.display = rows.length ? 'none' : 'block';
  $('#empty').textContent = rows.length ? '' : 'Nothing matches those filters.';
  $('#count').textContent = rows.length ? `${rows.length} shown` : '';

  $('#rows').innerHTML = rows.map(r => {
    const qual = [r.period, r.basis].filter(Boolean).map(x => `<b>${esc(x)}</b>`).join(' · ');
    const label = r.model
      ? `<span class="metric">${esc(r.metric || '—')}</span>
         <span class="qual">${esc(r.subject || '')}${qual ? ' · ' + qual : ''}</span>`
      : '<span class="none">unlabelled</span>';
    return `
    <tr class="${r.model && !r.is_fact ? 'no' : ''}">
      <td class="pg">${r.pdf_page}${r.printed_page ? `<br><small>p.${esc(r.printed_page)}</small>` : ''}</td>
      <td class="val">${esc([r.currency, r.value, r.unit].filter(Boolean).join(' ')) || '—'}</td>
      <td>${label}</td>
      <td class="ev">${r.row_label ? `<span class="lbl">${esc(r.row_label)}</span> ` : ''}${highlight(r)}${
        r.reject_reason ? ` <span class="why">${esc(r.reject_reason)}</span>` : ''}</td>
    </tr>`; }).join('');
}

async function upload(f) {
  $('#drop').textContent = `Mining ${f.name}…`;
  const body = new FormData();
  body.append('file', f);
  try {
    const r = await (await fetch('/api/documents', { method: 'POST', body })).json();
    $('#drop').innerHTML = r.duplicate
      ? 'Already uploaded — showing existing.'
      : `Mined ${r.mined} candidates, ${r.accepted} kept.`;
    current = r.doc_id;
    await loadDocs();
    await loadRows();
  } catch (e) {
    $('#drop').textContent = 'Upload failed: ' + e.message;
  }
  setTimeout(() => { $('#drop').innerHTML = 'Drop a PDF here<br>or click to choose'; }, 4000);
}

$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => e.target.files[0] && upload(e.target.files[0]);
$('#drop').ondragover = e => { e.preventDefault(); $('#drop').classList.add('over'); };
$('#drop').ondragleave = () => $('#drop').classList.remove('over');
$('#drop').ondrop = e => {
  e.preventDefault();
  $('#drop').classList.remove('over');
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
};

let t;
$('#q').oninput = () => { clearTimeout(t); t = setTimeout(loadRows, 200); };
$('#page').oninput = () => { clearTimeout(t); t = setTimeout(loadRows, 200); };
$('#rej').onchange = loadRows;
$('#kind').onchange = loadRows;
$('#only').onchange = loadRows;

$('#label').onclick = async () => {
  $('#label').disabled = true;
  const r = await (await fetch(`/api/documents/${current}/label`, { method: 'POST' })).json();
  if (r.detail) { $('#lstat').textContent = r.detail; $('#label').disabled = false; return; }
  $('#lstat').textContent = `${r.calls} calls for ${r.pending} rows in scope · ${r.model}`;
  const poll = setInterval(async () => {
    await loadDocs();
    const d = (await (await fetch('/api/documents')).json()).find(x => x.id === current);
    $('#lstat').textContent = `${d.labelled} labelled · ${d.facts} facts`;
    if (d.labelled >= r.pending) { clearInterval(poll); $('#label').disabled = false; }
    await loadRows();
  }, 4000);
  setTimeout(() => { clearInterval(poll); $('#label').disabled = false; }, 600000);
};

(async () => {
  const m = await (await fetch('/api/models')).json();
  $('#phase').textContent = m.available.includes(m.configured)
    ? `evidence mining + labelling · ${m.configured}`
    : `${m.configured} not pulled — run: ollama pull ${m.configured}`;
})();

loadDocs();
</script>
</body>
</html>
