# Encryption at rest, via Percona Server for MongoDB.
#
# Why this file exists: WiredTiger encryption at rest is a MongoDB Enterprise
# feature. The Community image in docker-compose.yml cannot do it at any
# setting, so "encryption" there means encryption in transit only. Percona
# Server for MongoDB is a drop-in Community fork that does ship data-at-rest
# encryption, so this override buys the third property without a licence.
#
#   bash bootstrap.sh                       # Community, TLS + RBAC, no at-rest
#   ENCRYPTED=1 bash bootstrap.sh           # Percona, adds at-rest
#
# or by hand:
#
#   docker compose --env-file ../.env \
#     -f docker-compose.yml -f docker-compose.encrypted.yml up -d
#
# The keyfile below is a local development key sitting next to the data it
# encrypts, which protects against a stolen disk image and nothing else. A real
# deployment points --vaultServerName at a KMIP service and never writes the key
# to the same host.

x-encrypted: &encrypted
  image: percona/percona-server-mongodb:8.0
  entrypoint:
    - bash
    - -c
    - install -m 400 -o mongodb -g mongodb /etc/mongo/secrets/keyfile /keyfile
      && install -m 400 -o mongodb -g mongodb /etc/mongo/secrets/encryption.key /enc.key
      && install -m 400 -o mongodb -g mongodb /etc/mongo/tls/server.pem /tls-server.pem
      && install -m 444 -o mongodb -g mongodb /etc/mongo/tls/ca.crt /tls-ca.crt
      && exec /entrypoint.sh "$$@"
    - bash
  command: >
    mongod
      --replSet rs0
      --bind_ip_all
      --keyFile /keyfile
      --enableEncryption
      --encryptionKeyFile /enc.key
      --encryptionCipherMode AES256-CBC
      --tlsMode requireTLS
      --tlsCertificateKeyFile /tls-server.pem
      --tlsCAFile /tls-ca.crt
      --tlsAllowConnectionsWithoutCertificates

services:
  mongo1: *encrypted
  mongo2: *encrypted
  mongo3: *encrypted
