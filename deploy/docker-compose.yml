# Three-node replica set with keyfile internal auth, RBAC, and TLS.
#
# Availability: three voting members, so one can be lost without losing the
# primary. On one host this survives a process failure, not a machine failure -
# it demonstrates the topology and gives real failover semantics, not real HA.
#
# Encryption in transit: TLS required on every client and intra-cluster
# connection, against a self-signed CA generated by bootstrap.sh. Nothing is
# committed; see .gitignore.
#
# Encryption at rest: NOT enabled here. WiredTiger encryption is a MongoDB
# Enterprise feature and the Community image cannot do it. See
# docker-compose.encrypted.yml for a Percona Server for MongoDB variant that
# can, and README "Storage" for the trade-off.

name: superjoin-facts

x-mongod: &mongod
  image: mongo:8
  restart: unless-stopped
  # Every secret is copied in and re-owned before mongod starts, because bind
  # mounts land differently on different hosts and mongod is strict about both
  # directions:
  #
  #   too open   - it refuses a keyfile others can read, and a file bind-mounted
  #                from NTFS arrives 0777 whatever the host says
  #   too closed - the TLS key is 0400 owned by the host user, and on Linux, where
  #                bind mounts DO enforce permissions, mongod has already dropped
  #                to uid 999 and cannot read it. That crash-loops the container.
  #
  # Docker Desktop hides the second case by ignoring permissions altogether, so it
  # only appears on Linux. Compose `configs` would be tidier but it ignores
  # uid/gid/mode outside swarm.
  entrypoint:
    - bash
    - -c
    - install -m 400 -o mongodb -g mongodb /etc/mongo/secrets/keyfile /keyfile
      && install -m 400 -o mongodb -g mongodb /etc/mongo/tls/server.pem /tls-server.pem
      && install -m 444 -o mongodb -g mongodb /etc/mongo/tls/ca.crt /tls-ca.crt
      && exec docker-entrypoint.sh "$$@"
    - bash
  command: >
    mongod
      --replSet rs0
      --bind_ip_all
      --keyFile /keyfile
      --tlsMode requireTLS
      --tlsCertificateKeyFile /tls-server.pem
      --tlsCAFile /tls-ca.crt
      --tlsAllowConnectionsWithoutCertificates
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set in .env}
    MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set in .env}
  healthcheck:
    test: >
      mongosh --quiet --tls --tlsCAFile /tls-ca.crt
        --tlsAllowInvalidHostnames
        --eval "db.adminCommand('ping').ok" || exit 1
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  mongo1:
    <<: *mongod
    container_name: facts-mongo1
    ports: ["27017:27017"]
    volumes:
      - mongo1-data:/data/db
      - ./secrets:/etc/mongo/secrets:ro
      - ./tls:/etc/mongo/tls:ro

  mongo2:
    <<: *mongod
    container_name: facts-mongo2
    ports: ["27018:27017"]
    volumes:
      - mongo2-data:/data/db
      - ./secrets:/etc/mongo/secrets:ro
      - ./tls:/etc/mongo/tls:ro

  mongo3:
    <<: *mongod
    container_name: facts-mongo3
    ports: ["27019:27017"]
    volumes:
      - mongo3-data:/data/db
      - ./secrets:/etc/mongo/secrets:ro
      - ./tls:/etc/mongo/tls:ro

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
